<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexaBrain</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{display:flex;height:100vh;background:#131314;color:#e3e3e3;overflow:hidden}
.sidebar{width:260px;background:#1e1f20;padding:15px;display:flex;flex-direction:column;gap:8px}
.sidebar h2{font-size:20px;color:#fff}
.newchat{background:#2a2b2c;padding:12px;border-radius:20px;text-align:center;cursor:pointer}
.side-item{padding:9px;border-radius:10px;color:#c4c7c5;font-size:13px;cursor:pointer}
.main{flex:1;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;padding:15px 20px;align-items:center}
.topbar b{font-size:22px;background:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.chat{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%}
.msg{margin:15px 0;display:flex;gap:12px;line-height:1.65;font-size:16px}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:#2e2f30;padding:12px 18px;border-radius:20px;max-width:85%}
.msg.ai .bubble{max-width:92%}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4285f4,#d96570);display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;flex-shrink:0}
.welcome{margin-top:40px}
.welcome h1{font-size:42px;background:linear-gradient(90deg,#4285f4,#9b72cb,#d96570);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:#9aa0a6;margin-top:10px;font-size:17px}
.suggest{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap}
.suggest div{background:#1e1f20;padding:12px;border-radius:12px;cursor:pointer;font-size:14px;flex:1;min-width:140px}
.input-area{max-width:800px;margin:0 auto 18px;width:calc(100% - 40px);background:#1e1f20;border-radius:30px;display:flex;align-items:center;padding:8px 8px 8px 20px}
.input-area input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:16px}
.input-area button{background:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px}
@media(max-width:700px){.sidebar{display:none}.welcome h1{font-size:30px}}
</style>
</head>
<body>
<div class="sidebar">
<h2>✦ NexaBrain</h2>
<div class="newchat" onclick="location.reload()">+ New chat</div>
<div class="side-item" onclick="askThis('Narendra Modi')">🇮🇳 Narendra Modi</div>
<div class="side-item" onclick="askThis('Taj Mahal')">🕌 Taj Mahal</div>
<div class="side-item" onclick="askThis('Elon Musk')">🚀 Elon Musk</div>
<div class="side-item" onclick="askThis('Virat Kohli')">🏏 Virat Kohli</div>
<div style="margin-top:auto;font-size:12px;color:#888">🌐 Internet Connected • NexaBrain</div>
</div>
<div class="main">
<div class="topbar"><b>NexaBrain</b><div>🌐 Super AI</div></div>
<div class="chat" id="chat">
<div class="welcome" id="welcome">
<h1>Hello 👋<br>How can I help you?</h1>
<p>I am NexaBrain - Your Super AI Assistant. Ask me anything!</p>
<div class="suggest">
<div onclick="askThis('Narendra Modi')">🇮🇳 Narendra Modi</div>
<div onclick="askThis('Taj Mahal')">🕌 Taj Mahal</div>
<div onclick="askThis('Elon Musk')">🚀 Elon Musk</div>
<div onclick="askThis('Virat Kohli')">🏏 Virat Kohli</div>
</div>
</div>
</div>
<div class="input-area">
<input id="inp" placeholder="Ask NexaBrain anything..." onkeydown="if(event.key==='Enter')send()">
<button onclick="send()">➤</button>
</div>
</div>
<script>
function askThis(t){document.getElementById('inp').value=t;send();}
async function send(){
let inp=document.getElementById('inp');
let text=inp.value.trim(); if(!text) return;
document.getElementById('welcome')?.remove();
let chat=document.getElementById('chat');
chat.innerHTML+=`<div class="msg user"><div class="bubble">${text}</div></div>`;
inp.value='';
let id="a"+Date.now();
chat.innerHTML+=`<div class="msg ai" id="${id}"><div class="avatar">✦</div><div class="bubble">Searching...</div></div>`;
chat.scrollTop=chat.scrollHeight;
let reply=await getInternetReply(text);
document.getElementById(id).querySelector('.bubble').innerHTML=reply;
chat.scrollTop=chat.scrollHeight;
}
async function getInternetReply(q){
let m=q.toLowerCase();
let blocked=["bomb","blast","explosive","gun banane","weapon","murder","kill","suicide","drug","ganja","charas","hack","password hack","porn","sex video","nudes","fake id","chori ka tarika","virus banane"];
for(let w of blocked){ if(m.includes(w)) return "Sorry, this information I cannot provide. Please ask something else."; }
if(m.includes("kaun ho")||m.includes("tum kaun")||m.includes("who are you")||m.includes("your name")) return "I am <b>NexaBrain</b> - Your Super AI Assistant.";
if(m.includes("hello")||m=="hi"||m.includes("namaste")) return "Hello! 👋 How can I help you today?";
if(m.includes("motivate")) return "You can do it! 🔥 Work hard every day, one day you will achieve your dreams. Don't give up!";
if(m.includes("pm")||m.includes("prime minister")||m.includes("modi")) return "India's Prime Minister is <b>Narendra Modi</b> 🇮🇳 He has been PM since 2014.";
try{
let clean=q.replace(/kaun hai|kya hai|kahan hai|ke baare me batao|batao|kaun|kya|kahan|who is|what is|tell me about/gi,"").trim();
if(!clean) clean=q;
let url=`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(clean)}`;
let res=await fetch(url);
if(res.ok){
let data=await res.json();
if(data.extract){ return `<b>${data.title}</b><br><br>${data.extract}<br><br><span style="font-size:13px;color:#9aa0a6">🌐 Source: Wikipedia</span>`; }
}
let sUrl=`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q)}&format=json&origin=*`;
let sRes=await fetch(sUrl);
let sData=await sRes.json();
if(sData.query.search.length>0){
let title=sData.query.search[0].title;
let res2=await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`);
let data2=await res2.json();
return `<b>${data2.title}</b><br><br>${data2.extract}<br><br><span style="font-size:13px;color:#9aa0a6">🌐 Source: Wikipedia</span>`;
}
return "I could not find this on the internet. Please try a short query like - <b>Narendra Modi, Taj Mahal, Elon Musk</b>";
}catch(e){ return "Internet is not connecting. Please check your connection and try again."; }
}
</script>
</body>
</html>
