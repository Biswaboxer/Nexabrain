<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Assistant</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #111318; color: #f3f4f6; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 20px; background: #181b22; border-bottom: 1px solid #262b36; display: flex; justify-content: space-between; align-items: center; }
    header button { background: #262b36; color: #f3f4f6; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; max-width: 860px; width: 100%; margin: 0 auto; }
    .msg { padding: 12px 16px; border-radius: 10px; line-height: 1.55; max-width: 85%; word-wrap: break-word; }
    .user { background: #2563eb; align-self: flex-end; }
    .assistant { background: #1e222b; border: 1px solid #2d3340; align-self: flex-start; }
    .assistant pre { background: #0d0f14; padding: 12px; border-radius: 8px; overflow-x: auto; }
    form { display: flex; gap: 10px; padding: 14px 20px; background: #181b22; border-top: 1px solid #262b36; max-width: 860px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; padding: 10px 12px; border-radius: 8px; border: 1px solid #2d3340; background: #111318; color: #f3f4f6; font-size: 15px; height: 48px; }
    button[type="submit"] { background: #2563eb; color: white; border: none; padding: 0 18px; border-radius: 8px; font-weight: 600; cursor: pointer; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <strong>AI Assistant</strong>
    <button id="clear-btn" type="button">New Chat</button>
  </header>

  <main id="chat"></main>

  <form id="chat-form">
    <textarea id="prompt-input" placeholder="Apna sawaal likhein... (Enter se bhejein, Shift+Enter se nayi line)" required></textarea>
    <button id="send-btn" type="submit">Send</button>
  </form>

  <script>
    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("chat-form");
    const inputEl = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const clearBtn = document.getElementById("clear-btn");

    // Gemini API format mein conversation history
    let history = [];

    function appendMessage(role, rawText = "") {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.dataset.raw = rawText;
      div.innerHTML = role === "assistant" ? marked.parse(rawText) : escapeHtml(rawText);
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    clearBtn.addEventListener("click", () => {
      history = [];
      chatEl.innerHTML = "";
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        formEl.requestSubmit();
      }
    });

    formEl.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = inputEl.value.trim();
      if (!prompt) return;

      inputEl.value = "";
      sendBtn.disabled = true;

      history.push({ role: "user", parts: [{ text: prompt }] });
      appendMessage("user", prompt);

      const assistantBubble = appendMessage("assistant", "");
      let fullReply = "";

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ history }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6).trim();
            if (payload === "[DONE]") break;

            const parsed = JSON.parse(payload);
            if (parsed.text) {
              fullReply += parsed.text;
              assistantBubble.innerHTML = marked.parse(fullReply);
              chatEl.scrollTop = chatEl.scrollHeight;
            }
          }
        }

        history.push({ role: "model", parts: [{ text: fullReply }] });
      } catch (err) {
        assistantBubble.innerHTML = "<p>Error: Jawab generate karne mein dikkat aayi.</p>";
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });
  </script>
</body>
</html>
